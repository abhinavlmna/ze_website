<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Ze Space Interior — a Kochi-based interior design and furniture production studio creating spaces that combine aesthetics, functionality and lasting quality.">
  <meta name="theme-color" content="#232C38">

  <!-- Social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ze Space Interior — Interior Design &amp; Furniture Production, Kochi">
  <meta property="og:description" content="Thoughtfully designed interiors and precisely crafted furniture, created around the way you live and work.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ze Space Interior">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ze Space Interior — Interior Design &amp; Furniture Production | Kochi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FBFAF8;
      overflow-x: hidden;
    }
    /* Shown until the Flutter view paints over it. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      letter-spacing: 0.28em;
      color: #2E9B93;
      background-color: #FBFAF8;
    }
  </style>
</head>
<body>
  <div id="loading">ZE SPACE INTERIOR</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
